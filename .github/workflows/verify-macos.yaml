name: verify-macos

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  IS_STABLE: 'true'

jobs:
  build-macos:
    name: build-macos (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            name: arm64
          - os: macos-15-intel
            arch: x86_64
            name: intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup (build)
        run: |
          dart setup.dart macos --env stable -v

      # 可选：写入架构信息（方便后面打包/排查）
      - name: Write arch tag
        run: |
          echo "BUILD_ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "RUNNER_OS=${{ runner.os }}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-macos-${{ matrix.arch }}-verify
          path: ./dist
          overwrite: true
